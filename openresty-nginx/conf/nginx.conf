
#user  nobody;
worker_processes  1;

error_log logs/error.log error;    # Erreurs et plus graves
error_log logs/infos.log info;     # Infos et plus graves
error_log logs/notice.log notice;  # Notices et plus graves
error_log logs/alerts.log alert;   # Alerts et plus graves
error_log logs/debugs.log debug;   # Debug complet

pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    resolver 127.0.0.1 valid=3s;
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    lua_package_path "lua/?.lua; /lualib/?.lua;;";

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;


    # Définir les upstreams pour vos services (adaptez hosts/ports)

    upstream sigif-app {
        server localhost:3001;
    }

    upstream landing-sigif {
        server localhost:3002;
    }

    upstream auth-service {
        server auth-sigif:3003;
    }

    upstream students-service {
        server students-sigif:3004;
    }


    server {
        listen       80;
        server_name  sigif.dev;
        # server_name  siva-cm.com maryrose-precessional-sabrina.ngrok-free.dev;
        set $upstream '';

        access_log  logs/access.log  main;
        
        # ==========================================
        # Route de serveur public
        # ==========================================
        
        # Routes publiques pour authentification
        location = /v1/auth/login {
            auth_request off;
            proxy_pass http://auth-service/api/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type "application/json";
            
        }

        location = /v1/auth/logout {
            auth_request off;
            proxy_pass http://auth-service/api/logout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location = /v1/auth/register {
            auth_request off;
            proxy_pass http://auth-service/api/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type "application/json";
            add_header Access-Control-Allow-Origin "http://localhost:3003";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }

        location = /v1/auth/verify-token {
            proxy_pass http://auth-service/api/validateTokenForServive;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type "application/json";
            add_header Access-Control-Allow-Origin "http://localhost:3003";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }

       
        # ==========================================
        # Route de serveur privée
        # ==========================================
        
        # ==========================================
        # Route utilisateurs
        location ~ ^/v1/users(/.*)?$ {
            # Gestion du préflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3003" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type application/json;
                return 204;
            }
            # access_by_lua_file lua/check_permissions.lua;
            proxy_pass http://auth-service/api/users$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_headers on;

            # CORS
            # add_header Access-Control-Allow-Origin "http://localhost:3003" always;
            # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            # add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        }
        # ==========================================
        # Route des permissions
        location ~ ^/v1/permission(s?)(/.*)?$ {
            # Gestion du préflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3003" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            access_by_lua_file lua/check_permissions.lua;
            proxy_pass http://auth-service/api/permission$1$2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_headers on;

            # CORS
            # add_header Access-Control-Allow-Origin "http://localhost:3003" always;
            # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            # add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        }
        # ==========================================
        # Route des roles
        location ~ ^/v1/role(s?)(/.*)?$ {
            # Gestion du préflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3003" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            access_by_lua_file lua/check_permissions.lua;
            proxy_pass http://auth-service/api/role$1$2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_headers on;
        
        }
        # ==========================================
        # Route des agents
        location ~ ^/v1/agent(s?)(/.*)?$ {
            # Gestion du préflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3003" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            access_by_lua_file lua/check_permissions.lua;
            proxy_pass http://auth-service/api/agent$1$2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_headers on;
        
        }
        
        location ~ ^/v1/centre(s?)(/.*)?$ {
            # Gestion du préflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3003" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            access_by_lua_file lua/check_permissions.lua;
            proxy_pass http://center-service/api/center$1$2$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_headers on;

            # CORS
            # add_header Access-Control-Allow-Origin "http://localhost:3003" always;
            # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            # add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        }
        
        location ~ ^/v1/affectation(s?)(/.*)?$ {
            # Gestion du préflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3003" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            access_by_lua_file lua/check_permissions.lua;
            proxy_pass http://center-service/api/assignment$1$2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_headers on;
        }
        
        # ==========================================
        # PWA react js
        # ==========================================

        location / {
            # rewrite ^/driverspace(/.*)$ $1 break; # Pas nécessaire dans ce cas car l'URL cible est le host complet
            proxy_pass http://landing-sigif;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Headers CORS
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Upgrade" always;
            
            # Important pour WebSocket
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ==========================================
        # Frontend React Principal (Port 3003) - AVEC SUPPORT WebSocket
        # ==========================================
        location /app {
            proxy_pass http://sigif-app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Important pour WebSocket
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

             # Cache pour les fichiers statiques
            # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            #     expires 1y;
            #     add_header Cache-Control "public, immutable";
            # }

            proxy_pass_request_headers on;
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }



        # Gestion des erreurs
        location @handle_auth_error {
            add_header Access-Control-Allow-Origin "http://localhost:3003" always;
            return 401 '{"success": false, "status_code": 401, "message": "Authentification ou autorisation échouée"}';
        }
    }


}
