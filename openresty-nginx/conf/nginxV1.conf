
#user  nobody;
worker_processes  1;

error_log logs/error.log error;    # Erreurs et plus graves
error_log logs/infos.log info;     # Infos et plus graves
error_log logs/notice.log notice;  # Notices et plus graves
error_log logs/alerts.log alert;   # Alerts et plus graves
error_log logs/debugs.log debug;   # Debug complet

pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    lua_package_path "lua/?.lua; /lualib/?.lua;;";

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;


    # Définir les upstreams pour vos services (adaptez hosts/ports)

    upstream auth-service {
        server 192.168.8.100:8001;
    }

    upstream center-service {
        server 192.168.8.100:8002;
    }


    server {
        listen       80;
        server_name  siva-cm.com;
        set $upstream '';

        access_log  logs/access.log  main;

        # Proxy pour le frontend React
        location / {
            proxy_pass http://localhost:3003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            add_header Access-Control-Allow-Origin "http://localhost:3003";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }
        location = /landing {
            proxy_pass http://localhost:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            add_header Access-Control-Allow-Origin "http://localhost:3003";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }

        # Gérer les requêtes OPTIONS pour CORS
        location ~* /siva/.* {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3003";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                add_header Access-Control-Max-Age 86400;
                return 204;
            }
        }

        # Routes publiques pour authentification
        location = /siva/auth/login {
            auth_request off;
            proxy_pass http://auth-service/api/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type "application/json";
            
        }

        location = /siva/auth/logout {
            auth_request off;
            proxy_pass http://auth-service/api/logout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location = /siva/auth/register {
            auth_request off;
            proxy_pass http://auth-service/api/register;
