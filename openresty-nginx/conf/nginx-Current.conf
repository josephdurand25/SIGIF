
#user  nobody;
worker_processes  1;

error_log logs/error.log error;    # Erreurs et plus graves
error_log logs/infos.log info;     # Infos et plus graves
error_log logs/notice.log notice;  # Notices et plus graves
error_log logs/alerts.log alert;   # Alerts et plus graves
error_log logs/debugs.log debug;   # Debug complet

pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    lua_package_path "lua/?.lua; /lualib/?.lua;;";

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;


    # Définir les upstreams pour vos services (adaptez hosts/ports)

    upstream auth-service {
        # server 192.168.8.100:8001;
        server auth-service:8006;
    }

    upstream center-service {
        # server 192.168.8.100:8002;
        server center-service:8007;
    }


    server {
        listen       80;
        server_name  siva-cm.com;
        set $upstream '';

        access_log  logs/access.log  main;
        
        # ==========================================
        # Route de serveur public
        # ==========================================
        
        # Routes publiques pour authentification
        location = /v1/auth/login {
            auth_request off;
            proxy_pass http://auth-service/api/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type "application/json";
            
        }

        location = /v1/auth/logout {
            auth_request off;
            proxy_pass http://auth-service/api/logout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location = /v1/auth/register {
            auth_request off;
            proxy_pass http://auth-service/api/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type "application/json";
            add_header Access-Control-Allow-Origin "http://localhost:3003";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }

        location = /v1/auth/verify-token {
            proxy_pass http://auth-service/api/validate-token-front;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type "application/json";
            add_header Access-Control-Allow-Origin "http://localhost:3003";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }
       
        # ==========================================
        # Route de serveur privée
        # ==========================================
        
        location ~ ^/v1/users(/.*)?$ {
            # Gestion du préflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3003" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            access_by_lua_file lua/check_permissions.lua;
            proxy_pass http://fleet-service/api/users$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_headers on;

            # CORS
            add_header Access-Control-Allow-Origin "http://localhost:3003" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        }
        
        # ==========================================
        # PWA react js
        # ==========================================

        location /public/ {
            # rewrite ^/driverspace(/.*)$ $1 break; # Pas nécessaire dans ce cas car l'URL cible est le host complet
            proxy_pass http://localhost:3004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Headers CORS
            add_header Access-Control-Allow-Origin "http://siva-cm.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Upgrade" always;
            
            # Important pour WebSocket
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # =====================
        # Frontend React
        # =====================
        location / {
            proxy_pass http://localhost:3003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            add_header Access-Control-Allow-Origin "http://localhost:3003";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }

        # Gestion des erreurs
        location @handle_auth_error {
            add_header Access-Control-Allow-Origin "http://localhost:3003" always;
            return 401 '{"success": false, "status_code": 401, "message": "Authentification ou autorisation échouée"}';
        }
    }


}
